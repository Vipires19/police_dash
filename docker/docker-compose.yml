services:
  db:
    image: postgres:16-alpine

    env_file:
      - ../.env

    environment:
      POSTGRES_USER: pelotao
      POSTGRES_PASSWORD: pelotao
      POSTGRES_DB: pelotao
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelotao -d pelotao"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    
    env_file:
      - ../.env

    environment:
      DATABASE_URL: postgresql+psycopg://pelotao:pelotao@db:5432/pelotao
  
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000

    env_file:
      - ../.env
      
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
